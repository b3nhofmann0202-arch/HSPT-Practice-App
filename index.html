<html lang="en">
<head>

<style>
  :root{
    --paper:#F6F1E4; --card:#FFFFFF; --ink:#1C2B45; --maroon:#7A2331;
    --gold:#B8912F; --slate:#5C6270; --success:#3F6B4E; --border:#D8D2BF; --tint:#EDE7D6;
  }
  html[data-theme="dark"]{
    --paper:#161B26; --card:#1F2534; --ink:#EDE7D6; --maroon:#D9808F;
    --gold:#D8B65C; --slate:#98A0B3; --success:#7FBF9A; --border:#333B4E; --tint:#262E40;
  }
  body{transition:background-color 0.15s ease, color 0.15s ease}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  .app{display:flex;min-height:100vh}
  .sidebar{width:216px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);
    padding:20px 14px;display:flex;flex-direction:column;gap:4px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding:0 6px}
  .seal{width:32px;height:32px;border-radius:50%;border:2px solid var(--gold);display:flex;
    align-items:center;justify-content:center;font-family:'Source Serif 4',serif;font-weight:600;
    font-size:14px;color:var(--maroon);flex-shrink:0}
  .brand-name{font-family:'Source Serif 4',serif;font-weight:600;font-size:18px}
  .navbtn{display:flex;align-items:center;gap:10px;text-align:left;background:transparent;
    border:none;border-left:3px solid transparent;padding:10px 10px;border-radius:0 8px 8px 0;
    font-size:14px;color:var(--ink);cursor:pointer;font-family:'Inter',sans-serif;width:100%}
  .navbtn:hover{background:var(--tint)}
  .navbtn.active{border-left-color:var(--maroon);background:var(--tint);font-weight:500}
  .navdot{width:8px;height:8px;border-radius:50%;background:var(--slate);flex-shrink:0}
  .navbtn.active .navdot{background:var(--maroon)}
  .sidebar-footer{margin-top:auto;padding:12px 10px;border-top:1px solid var(--border);font-size:12px;color:var(--slate)}
  main{flex:1;padding:32px 40px;max-width:760px}
  h1,h2,h3{font-family:'Source Serif 4',serif;font-weight:600;margin:0}
  .muted{color:var(--slate)}
  .card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:16px 18px}
  .btn{background:var(--ink);color:var(--paper);border:none;font-size:13px;font-weight:500;
    padding:9px 16px;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif}
  .btn.ghost{background:transparent;color:var(--ink);border:0.5px solid var(--border)}
  .btn:hover{opacity:0.9}
  input,textarea{font-family:'Inter',sans-serif;font-size:13px;border:0.5px solid var(--border);
    border-radius:8px;padding:8px 10px;background:var(--card);color:var(--ink)}
  .mono{font-family:'IBM Plex Mono',monospace}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 22px}
  .tile{border-radius:0 0 10px 10px;border:0.5px solid var(--border);border-top:4px solid var(--slate);
    padding:12px;background:var(--card)}
  .tile .pct{font-size:12px;color:var(--slate);margin:2px 0 0}
  .tile .name{font-size:13px;font-weight:500;margin:0}
  .bar{height:5px;border-radius:3px;background:var(--tint);overflow:hidden;margin-top:8px}
  .bar > div{height:100%}
  .quicklinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .quick{border-radius:10px;padding:12px;text-align:center;cursor:pointer;font-size:12px;font-weight:500;
    border:0.5px solid var(--border);background:var(--card)}
  .quick.primary{background:var(--ink);color:var(--paper);border:none}
  .placeholder{padding:40px 20px;text-align:center;border:1px dashed var(--border);border-radius:12px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
  .cal-dow{font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:var(--slate);

  .cal-cell{border:0.5px solid var(--border);border-radius:8px;padding:6px;min-height:60px;
    background:var(--card);display:flex;flex-direction:column;gap:3px}
  .cal-cell.clickable{cursor:pointer}
  .cal-cell.clickable:hover{background:var(--tint)}
  .cal-cell.empty{border:none;background:transparent}
  .cal-cell.today{border:1.5px solid var(--gold)}
  .cal-cell.done{opacity:0.55}
  .cal-daynum{font-size:11px;font-weight:500}
  .cal-task{font-size:9.5px;line-height:1.25;color:var(--slate)}
  .auth-wrap{max-width:340px;margin:80px auto;padding:0 20px}
  .warning{background:#FAECE7;border:0.5px solid #E8B9A4;color:#712B13;border-radius:10px;
    padding:12px 14px;font-size:12px;line-height:1.6;margin-bottom:16px}
  .chatlog{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;max-height:420px;overflow-y:auto}
  .bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;max-width:85%}
  .bubble.tutor{background:var(--card);border:0.5px solid var(--border);border-bottom-left-radius:2px;align-self:flex-start}
  .bubble.student{background:var(--ink);color:var(--paper);border-bottom-right-radius:2px;align-self:flex-end}
  .chat-input-row{display:flex;gap:8px}

  .picker-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
  .picker-tile{background:var(--card);border:0.5px solid var(--border);border-radius:10px;padding:14px;
    cursor:pointer;text-align:left}
  .picker-tile:hover{border-color:var(--maroon)}
  .picker-tile .name{font-weight:500;font-size:14px;margin:0 0 4px}
  .picker-tile .count{font-size:12px;color:var(--slate);margin:0}
  .test-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);

  .timer{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:500;color:var(--maroon)}
  .choice-row{display:flex;align-items:center;gap:10px;background:var(--card);border:0.5px solid var(--border);
    border-radius:8px;padding:10px 12px;cursor:pointer;margin-bottom:8px}
  .choice-row.selected{border:1.5px solid var(--maroon)}
  .choice-dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);flex-shrink:0}
  .choice-row.selected .choice-dot{background:var(--maroon);border-color:var(--maroon)}
  .bubblegrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;max-height:170px;overflow-y:auto;
    padding:10px;border:0.5px solid var(--border);border-radius:8px}
  .qnav-btn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--ink);flex-shrink:0}
  .qnav-btn:hover{border-color:var(--maroon)}
  .passage-box{background:var(--card);border:0.5px solid var(--border);border-radius:10px;padding:14px 16px;
    margin-bottom:16px;font-size:13px;line-height:1.65;max-height:180px;overflow:auto}
  .review-item{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .tag-missed{font-size:12px;background:#FAECE7;color:#712B13;padding:2px 8px;border-radius:12px;font-weight:500}
  .tag-correct{font-size:12px;background:#E9F1EC;color:#2B5C3B;padding:2px 8px;border-radius:12px;font-weight:500}
  .skill-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
  .skill-card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:16px;cursor:pointer}
  .skill-card:hover{border-color:var(--maroon)}
  .skill-card .icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-family:'Source Serif 4',serif;font-weight:600;font-size:15px;color:#fff;margin-bottom:10px}
  .flashcard{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:24px 20px;text-align:center;margin-bottom:16px}
  .streak-pill{font-size:12px;background:var(--tint);color:var(--maroon);padding:3px 10px;border-radius:12px;font-weight:500}
  textarea.rewrite-box{width:100%;min-height:70px;resize:vertical}
  .model-answer{background:var(--tint);border-radius:8px;padding:12px 14px;margin-top:10px;font-size:13px}
  .lesson-section-header{font-size:12px;text-transform:uppercase;letter-spacing:0.04em;color:var(--slate);margin:18px 0 8px}
  .lesson-section-header:first-child{margin-top:0}
  .lesson-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);
    border:0.5px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:6px;cursor:pointer}
  .lesson-row:hover{border-color:var(--maroon)}
  .lesson-check{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px}
  .lesson-check.done{background:var(--success);color:#fff}
  .lesson-check.todo{border:1.5px solid var(--border)}
  .lesson-content{font-size:14px;line-height:1.7}
  .lesson-content ul,.lesson-content ol{margin:8px 0;padding-left:20px}
  .lesson-content p{margin:0 0 10px}
</style>
</head>

<script>

// ---------------------------------------------------------------------------------

// ---------- Theme (dark mode) ----------
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('merit-theme', theme);
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
  if (typeof renderNav === 'function' && document.getElementById('sidebar')) renderNav();
}
applyTheme(localStorage.getItem('merit-theme') || 'light');

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SECTIONS = [
  {key:'verbal', name:'Verbal skills', color:'#7A2331'},
  {key:'quant', name:'Quantitative', color:'#B8912F'},
  {key:'reading', name:'Reading', color:'#1C2B45'},
  {key:'math', name:'Mathematics', color:'#3F6B4E'},
  {key:'language', name:'Language', color:'#5C6270'}
];
// Official HSPT-length spec: exact question counts and time limits per section.
// Section order here matches the real test order and is used for the full practice test.
const OFFICIAL_TEST_SPEC = {
  verbal:   { count: 60, minutes: 16 },
  quant:    { count: 52, minutes: 30 },
  reading:  { count: 62, minutes: 25 },
  math:     { count: 64, minutes: 45 },
  language: { count: 60, minutes: 25 }
};
function formatDuration(totalMinutes){
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  if (h === 0) return `${m} min`;
  return `${h}h ${m}m`;
}
function shuffleArray(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// Reading questions are grouped by passage; a random test draws whole passages
// (keeping each passage's questions together and in order) until the target count
// is reached, trimming only the final passage down to the exact remainder needed.
function pickReadingQuestions(count){
  const groups = {};
  QUESTIONS.reading.forEach(q => {
    if (!groups[q.passage]) groups[q.passage] = [];
    groups[q.passage].push({ ...q, section: 'reading' });
  });
  const passageKeys = shuffleArray(Object.keys(groups));
  let result = [];
  for (const pk of passageKeys) {
    if (result.length >= count) break;
    const groupQs = groups[pk];
    if (result.length + groupQs.length <= count) {
      result = result.concat(groupQs);
    } else {
      result = result.concat(groupQs.slice(0, count - result.length));
    }
  }
  return result;
}
function pickSectionQuestions(key, count){
  if (key === 'reading') return pickReadingQuestions(count);
  const pool = QUESTIONS[key].map(q => ({ ...q, section: key }));
  return shuffleArray(pool).slice(0, Math.min(count, pool.length));
}
const NAV = [
  {key:'dashboard', label:'Dashboard'},
  {key:'pacing', label:'Pacing plan'},
  {key:'practice', label:'Practice tests'},
  {key:'tutor', label:'AI tutor'},
  {key:'skills', label:'Skill builder'},
  {key:'lessons', label:'Lessons'},
  {key:'mistakes', label:'Mistake journal'}
];

let session = null;
let profile = null;
let activeView = 'dashboard';
let tutorHistory = []; // {role:'student'|'tutor', text}

// ---------- Pacing plan state ----------
let pacingState = { monthOffset: 0 };
let pacingTodayTask = null; // set whenever dashboard or pacing view renders; read by the "Go" button

// ---------- Practice test state ----------
let practiceState = {
  phase: 'picker',       // 'picker' | 'sectionIntro' | 'taking' | 'review'
  sectionKey: null,      // null means full test (all sections, official order)
  sectionOrder: [],      // ordered list of section keys for this attempt
  currentSectionIdx: 0,  // index into sectionOrder
  sectionQuestions: {},  // key -> pre-generated random question array for this attempt
  questions: [],         // alias for sectionQuestions[sectionOrder[currentSectionIdx]]
  index: 0,
  answers: {},           // questionId -> chosen letter (global across all sections)
  flagged: {},           // questionId -> true
  secondsLeft: 0,        // seconds left in the CURRENT section
  timerHandle: null,
  reviewIndex: 0,
  missed: [],
  correctCount: 0,
  totalQuestions: 0
};

// ---------- Skill builder state ----------
let skillState = {
  mode: 'menu',       // 'menu' | 'vocab' | 'dojo' | 'punctuation' | 'quickfire'
  // vocab
  vocabQueue: [],
  vocabIndex: 0,
  vocabAnswered: false,
  // dojo
  dojoQueue: [],
  dojoIndex: 0,
  dojoStreak: 0,
  dojoAnswered: false,
  // punctuation
  punctIndex: 0,
  punctRevealed: false,
  // quickfire
  qfCategory: null,
  qfQueue: [],
  qfIndex: 0,
  qfScore: 0,
  qfSecondsLeft: 0,
  qfTimerHandle: null,
  qfAnswered: false,
  qfDone: false,
  // adaptive difficulty
  qfLevel: 'easy',
  qfCorrectStreak: 0,
  qfIncorrectStreak: 0,
  qfUsedIds: null,
  qfPools: null,
  qfLevelChangeMsg: null,
  qfLevelStats: null
};
const QF_TIME_PER_QUESTION = 12;
const QF_ROUND_SIZE = 10;
// Weighted mix of tiers served at each adaptive level: mostly on-level questions,
// with some easier/harder ones mixed in for variety and smoother transitions.
const QF_LEVEL_WEIGHTS = {
  easy:   { easy: 0.7, medium: 0.3, hard: 0 },
  medium: { easy: 0.2, medium: 0.6, hard: 0.2 },
  hard:   { easy: 0,   medium: 0.3, hard: 0.7 }
};

function ensureSkillsProgress(){
  if (!profile.skills_progress) profile.skills_progress = {};
  if (!profile.skills_progress.vocab) profile.skills_progress.vocab = {};
  if (typeof profile.skills_progress.dojoBestStreak !== 'number') profile.skills_progress.dojoBestStreak = 0;
  if (!profile.skills_progress.quickfireBest) profile.skills_progress.quickfireBest = {};
  if (!profile.skills_progress.qfAdaptive) profile.skills_progress.qfAdaptive = {};
  if (!profile.skills_progress.qfAdaptive.quant) profile.skills_progress.qfAdaptive.quant = { level: 'easy' };
  if (!profile.skills_progress.qfAdaptive.math) profile.skills_progress.qfAdaptive.math = { level: 'easy' };
  if (!profile.pacing_plan) profile.pacing_plan = { completed: {} };
  if (!profile.pacing_plan.completed) profile.pacing_plan.completed = {};
  if (!profile.pacing_plan.availableDays) profile.pacing_plan.availableDays = [true,true,true,true,true,true,true];
  if (!profile.lessons_completed) profile.lessons_completed = {};
}

// ---------- Lessons state ----------
let lessonsState = {
  view: 'menu',        // 'menu' | 'detail'
  currentLessonId: null,
  phase: 'content',     // 'content' | 'quiz' | 'result'
  quizIndex: 0,
  quizAnswered: false,
  quizSelected: null,
  quizScore: 0
};

// ---------- Mistake journal state ----------
let mistakeFilter = 'all'; // 'all' | 'Practice test' | 'Skill builder' | 'Lesson comprehension check'

function daysUntil(dateStr){
  const now = new Date();
  const target = new Date(dateStr + 'T00:00:00');
  return Math.ceil((target - now) / (1000*60*60*24));
}

// ---------- Auth screen ----------
function renderAuth(mode){
  mode = mode || 'login';
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="brand" style="justify-content:center;margin-bottom:24px">
        <div class="seal">M</div><span class="brand-name">Merit</span>
      </div>
      <div class="card">
        <p style="font-weight:500;font-size:14px;margin:0 0 14px">${mode === 'login' ? 'Log in' : 'Create your account'}</p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">
          <input id="auth-email" type="email" placeholder="Email">
          <input id="auth-password" type="password" placeholder="Password">
        </div>
        <button class="btn" style="width:100%;margin-bottom:10px" onclick="doAuth('${mode}')">${mode === 'login' ? 'Log in' : 'Sign up'}</button>
        <p style="font-size:12px;text-align:center;margin:0">
          ${mode === 'login'
            ? `New here? <a href="#" onclick="renderAuth('signup');return false" style="color:var(--maroon)">Create an account</a>`
            : `Already have an account? <a href="#" onclick="renderAuth('login');return false" style="color:var(--maroon)">Log in</a>`}
        </p>
        ${mode === 'login' ? `<p style="font-size:12px;text-align:center;margin:8px 0 0"><a href="#" onclick="renderForgotPassword();return false" style="color:var(--slate)">Forgot password?</a></p>` : ''}
        <p id="auth-error" style="font-size:12px;color:var(--maroon);margin:10px 0 0"></p>
      </div>
    </div>`;
}

async function doAuth(mode){
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  const { data, error } = mode === 'login'
    ? await supa.auth.signInWithPassword({ email, password })
    : await supa.auth.signUp({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  session = data.session;
  await afterLogin();
}

// ---------- Forgot password ----------
function renderForgotPassword(){
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="brand" style="justify-content:center;margin-bottom:24px">
        <div class="seal">M</div><span class="brand-name">Merit</span>
      </div>
      <div class="card">
        <p style="font-weight:500;font-size:14px;margin:0 0 6px">Reset your password</p>
        <p class="muted" style="font-size:12px;margin:0 0 14px">Enter your email and we'll send you a link to set a new password.</p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">
          <input id="forgot-email" type="email" placeholder="Email">
        </div>
        <button class="btn" style="width:100%;margin-bottom:10px" onclick="sendResetEmail()">Send reset link</button>
        <p style="font-size:12px;text-align:center;margin:0">
          <a href="#" onclick="renderAuth('login');return false" style="color:var(--maroon)">Back to log in</a>
        </p>
        <p id="forgot-error" style="font-size:12px;color:var(--maroon);margin:10px 0 0"></p>
        <p id="forgot-success" style="font-size:12px;color:var(--success);margin:10px 0 0"></p>
      </div>
    </div>`;
}

async function sendResetEmail(){
  const email = document.getElementById('forgot-email').value;
  const errEl = document.getElementById('forgot-error');
  const successEl = document.getElementById('forgot-success');
  errEl.textContent = '';
  successEl.textContent = '';
  if (!email) { errEl.textContent = 'Enter your email first.'; return; }
  const { error } = await supa.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
  if (error) { errEl.textContent = error.message; return; }
  successEl.textContent = 'Check your email for a link to reset your password.';
}

// ---------- Set new password (after clicking the emailed reset link) ----------
function renderResetPassword(){
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="brand" style="justify-content:center;margin-bottom:24px">
        <div class="seal">M</div><span class="brand-name">Merit</span>
      </div>
      <div class="card">
        <p style="font-weight:500;font-size:14px;margin:0 0 6px">Set a new password</p>
        <p class="muted" style="font-size:12px;margin:0 0 14px">Choose a new password for your account.</p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">
          <input id="new-password" type="password" placeholder="New password">
        </div>
        <button class="btn" style="width:100%;margin-bottom:10px" onclick="updatePassword()">Update password</button>
        <p id="reset-error" style="font-size:12px;color:var(--maroon);margin:10px 0 0"></p>
      </div>
    </div>`;
}

async function updatePassword(){
  const password = document.getElementById('new-password').value;
  const errEl = document.getElementById('reset-error');
  errEl.textContent = '';
  if (!password || password.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; return; }
  const { error } = await supa.auth.updateUser({ password });
  if (error) { errEl.textContent = error.message; return; }
  await afterLogin();
}

async function afterLogin(){
  await loadProfile();
  ensureSkillsProgress();
  renderApp();
}

// ---------- Profile ----------
async function loadProfile(){
  const { data: { user } } = await supa.auth.getUser();
  let { data, error } = await supa.from('profiles').select('*').eq('id', user.id).single();
  if (error || !data) {
    // Fallback in case the auto-create trigger hasn't run yet
    const insert = await supa.from('profiles').insert({ id: user.id }).select().single();
    data = insert.data;
  }
  profile = data;
}

async function saveProfile(fields){
  Object.assign(profile, fields);
  await supa.from('profiles').update(fields).eq('id', profile.id);
}

async function logMistake(entry){
  const newMistakes = [...(profile.mistakes || []), { date: new Date().toISOString().slice(0,10), ...entry }].slice(-300);
  await saveProfile({ mistakes: newMistakes });
}

// ---------- Practice tests ----------
function renderPractice(){
  const root = document.getElementById('view-root');
  if (practiceState.phase === 'sectionIntro') { root.innerHTML = sectionIntroHTML(); return; }
  if (practiceState.phase === 'taking') { root.innerHTML = testTakingHTML(); return; }
  if (practiceState.phase === 'review') { root.innerHTML = reviewHTML(); return; }
  root.innerHTML = pickerHTML();
}

function pickerHTML(){
  const fullMinutes = Object.values(OFFICIAL_TEST_SPEC).reduce((a,s)=>a+s.minutes,0);
  const fullCount = Object.values(OFFICIAL_TEST_SPEC).reduce((a,s)=>a+s.count,0);
  let tiles = `<div class="picker-tile" onclick="startTest(null)">
      <p class="name">Full practice test</p>
      <p class="count">All 5 sections &middot; ${fullCount} questions &middot; ${formatDuration(fullMinutes)}</p>
    </div>`;
  SECTIONS.forEach(s => {
    const spec = OFFICIAL_TEST_SPEC[s.key];
    tiles += `<div class="picker-tile" onclick="startTest('${s.key}')">
      <p class="name">${s.name}</p>
      <p class="count">${spec.count} questions &middot; ${formatDuration(spec.minutes)}</p>
    </div>`;
  });
  return `<h1>Practice tests</h1>
    <p class="muted" style="margin:6px 0 0">Choose a full test or focus on one section. Each test matches the real HSPT's question count and timing, with a fresh random set of questions drawn every time.</p>
    <div class="picker-grid">${tiles}</div>`;
}

function startTest(sectionKey){
  const order = sectionKey ? [sectionKey] : SECTIONS.map(s => s.key);
  const sectionQuestions = {};
  order.forEach(key => { sectionQuestions[key] = pickSectionQuestions(key, OFFICIAL_TEST_SPEC[key].count); });
  practiceState = {
    phase: 'sectionIntro',
    sectionKey,
    sectionOrder: order,
    currentSectionIdx: 0,
    sectionQuestions,
    questions: sectionQuestions[order[0]],
    index: 0,
    answers: {},
    flagged: {},
    secondsLeft: OFFICIAL_TEST_SPEC[order[0]].minutes * 60,
    timerHandle: null,
    reviewIndex: 0,
    missed: [],
    correctCount: 0,
    totalQuestions: 0
  };
  saveProfile({ resume_section: sectionKey ? SECTIONS.find(s=>s.key===sectionKey).name : 'Full practice test' });
  renderNav();
  renderView();
}

function sectionIntroHTML(){
  const key = practiceState.sectionOrder[practiceState.currentSectionIdx];
  const spec = OFFICIAL_TEST_SPEC[key];
  const name = SECTIONS.find(s=>s.key===key).name;
  const multiSection = practiceState.sectionOrder.length > 1;
  return `
    <div class="card" style="max-width:480px;margin:60px auto;text-align:center">
      ${multiSection ? `<p class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin:0 0 10px">Section ${practiceState.currentSectionIdx+1} of ${practiceState.sectionOrder.length}</p>` : ''}
      <h1 style="margin:0 0 8px">${name}</h1>
      <p class="muted" style="margin:0 0 22px">${spec.count} questions &middot; ${spec.minutes} minutes</p>
      <button class="btn" onclick="beginCurrentSection()">Begin ${multiSection ? 'section' : 'test'}</button>
    </div>`;
}

function beginCurrentSection(){
  practiceState.phase = 'taking';
  startTimer();
  renderView();
}

function advanceSection(){
  if (practiceState.timerHandle) clearInterval(practiceState.timerHandle);
  const nextIdx = practiceState.currentSectionIdx + 1;
  if (nextIdx >= practiceState.sectionOrder.length) {
    finishTest();
    return;
  }
  practiceState.currentSectionIdx = nextIdx;
  const key = practiceState.sectionOrder[nextIdx];
  practiceState.questions = practiceState.sectionQuestions[key];
  practiceState.index = 0;
  practiceState.secondsLeft = OFFICIAL_TEST_SPEC[key].minutes * 60;
  practiceState.phase = 'sectionIntro';
  renderNav();
  renderView();
}

function startTimer(){
  if (practiceState.timerHandle) clearInterval(practiceState.timerHandle);
  practiceState.timerHandle = setInterval(() => {
    practiceState.secondsLeft--;
    const el = document.getElementById('test-timer');
    if (el) el.textContent = formatTime(practiceState.secondsLeft);
    if (practiceState.secondsLeft <= 0) {
      clearInterval(practiceState.timerHandle);
      advanceSection();
    }
  }, 1000);
}

function formatTime(totalSec){
  const s = Math.max(0, totalSec);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function testTakingHTML(){
  const q = practiceState.questions[practiceState.index];
  const sectionName = q.section ? SECTIONS.find(s=>s.key===q.section).name : '';
  let passageHTML = '';
  if (q.passage) passageHTML = `<div class="passage-box">${PASSAGES[q.passage]}</div>`;

  let choicesHTML = '';
  Object.entries(q.choices).forEach(([letter, choice]) => {
    const selected = practiceState.answers[q.id] === letter;
    choicesHTML += `<div class="choice-row ${selected?'selected':''}" onclick="selectAnswer('${q.id}','${letter}')">
      <span class="choice-dot"></span><span style="font-size:13px">${letter} &nbsp; ${choice.text}</span></div>`;
  });

  let grid = '';
  practiceState.questions.forEach((qq, i) => {
    let bg = 'var(--card)', color = 'var(--ink)';
    if (i === practiceState.index) { bg = 'var(--ink)'; color = 'var(--paper)'; }
    else if (practiceState.flagged[qq.id]) { bg = 'var(--gold)'; color = '#fff'; }
    else if (practiceState.answers[qq.id]) { bg = 'var(--success)'; color = '#fff'; }
    grid += `<div class="qnav-btn" style="background:${bg};color:${color}" onclick="jumpToQuestion(${i})" title="Question ${i+1}">${i+1}</div>`;
  });

  const isLastQuestionInSection = practiceState.index === practiceState.questions.length - 1;
  const isLastSection = practiceState.currentSectionIdx === practiceState.sectionOrder.length - 1;
  const multiSection = practiceState.sectionOrder.length > 1;

  let nextButtonHTML;
  if (!isLastQuestionInSection) {
    nextButtonHTML = `<button class="btn" onclick="nextQuestion()">Next</button>`;
  } else if (isLastSection) {
    nextButtonHTML = `<button class="btn" onclick="finishTest()">Submit test</button>`;
  } else {
    nextButtonHTML = `<button class="btn" onclick="advanceSection()">Finish section</button>`;
  }

  return `
    <div class="test-header">
      <div>
        <p class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin:0">
          ${sectionName || 'Full practice test'}${multiSection ? ` &middot; Section ${practiceState.currentSectionIdx+1} of ${practiceState.sectionOrder.length}` : ''}</p>
        <h1 style="font-size:18px">Question ${practiceState.index+1} of ${practiceState.questions.length}</h1>
      </div>
      <div style="text-align:right">
        <p class="muted" style="font-size:11px;margin:0">Time remaining</p>
        <p class="timer" id="test-timer">${formatTime(practiceState.secondsLeft)}</p>
      </div>
    </div>
    ${passageHTML}
    <p style="font-size:14px;font-weight:500;margin:0 0 14px">${q.prompt}</p>
    <div style="margin-bottom:18px">${choicesHTML}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <button class="btn ghost" onclick="toggleFlag('${q.id}')">${practiceState.flagged[q.id] ? 'Unflag' : 'Flag for review'}</button>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" onclick="prevQuestion()" ${practiceState.index===0?'disabled':''}>Back</button>
        ${nextButtonHTML}
      </div>
    </div>
    <div class="bubblegrid">${grid}</div>
    <p class="muted" style="font-size:11px;margin:6px 0 0">Green = answered &middot; gold = flagged &middot; navy = current</p>
  `;
}

function selectAnswer(qid, letter){
  practiceState.answers[qid] = letter;
  renderView();
}

function toggleFlag(qid){
  practiceState.flagged[qid] = !practiceState.flagged[qid];
  renderView();
}

function nextQuestion(){
  if (practiceState.index < practiceState.questions.length - 1) { practiceState.index++; renderView(); }
}
function prevQuestion(){
  if (practiceState.index > 0) { practiceState.index--; renderView(); }
}
function jumpToQuestion(i){
  practiceState.index = i;
  renderView();
}

async function finishTest(){
  if (practiceState.timerHandle) clearInterval(practiceState.timerHandle);

  // Gather every question across every section in this attempt (not just the current one)
  let allQuestions = [];
  practiceState.sectionOrder.forEach(key => {
    allQuestions = allQuestions.concat(practiceState.sectionQuestions[key]);
  });

  const missed = [];
  const scoreBySection = {};
  allQuestions.forEach(q => {
    const sec = q.section;
    scoreBySection[sec] = scoreBySection[sec] || { correct: 0, total: 0 };
    scoreBySection[sec].total++;
    const chosen = practiceState.answers[q.id];
    if (chosen === q.correct) {
      scoreBySection[sec].correct++;
    } else {
      missed.push({ ...q, chosen: chosen || null });
    }
  });

  // Update mastery per section touched: blend new result with prior mastery (simple rolling average)
  const newMastery = { ...(profile.mastery || {}) };
  Object.entries(scoreBySection).forEach(([sec, r]) => {
    const newPct = Math.round((r.correct / r.total) * 100);
    const prior = newMastery[sec] || 0;
    newMastery[sec] = Math.round((prior + newPct) / 2);
  });

  // Append missed questions to the mistake journal
  const journalEntries = missed.map(m => ({
    source: 'practice', section: m.section, skill: m.skill, prompt: m.prompt,
    chosen: m.chosen ? m.choices[m.chosen].text : null, correct: m.choices[m.correct].text,
    date: new Date().toISOString().slice(0,10)
  }));
  const newMistakes = [...(profile.mistakes || []), ...journalEntries].slice(-300);

  // Streak: increment once per calendar day
  const today = new Date().toISOString().slice(0,10);
  let newStreak = profile.streak || 0;
  if (profile.last_active !== today) newStreak++;

  await saveProfile({
    mastery: newMastery,
    mistakes: newMistakes,
    streak: newStreak,
    last_active: today,
    resume_section: null
  });

  practiceState.phase = 'review';
  practiceState.missed = missed;
  practiceState.reviewIndex = 0;
  practiceState.totalQuestions = allQuestions.length;
  practiceState.correctCount = allQuestions.length - missed.length;
  renderNav();
  renderView();
}

function reviewHTML(){
  const total = practiceState.totalQuestions;
  const correct = practiceState.correctCount;
  const pct = Math.round((correct/total)*100);
  const missed = practiceState.missed;

  if (missed.length === 0) {
    return `<h1>Test review</h1>
      <p class="muted" style="margin:6px 0 20px">${correct} of ${total} correct &middot; ${pct}%</p>

      <div style="margin-top:16px"><button class="btn" onclick="backToDashboardFromReview()">Back to dashboard</button></div>`;
  }

  const idx = Math.min(practiceState.reviewIndex, missed.length - 1);
  const m = missed[idx];
  const isLastMissed = idx === missed.length - 1;
  const chosenExplain = m.chosen ? m.choices[m.chosen].explain : null;
  const correctExplain = m.choices[m.correct].explain;

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div>
        <h1>Test review</h1>
        <p class="muted" style="margin:2px 0 0">${correct} of ${total} correct</p>
      </div>
      <div style="width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);display:flex;
        align-items:center;justify-content:center;font-family:'Source Serif 4',serif;font-weight:600;font-size:14px;color:var(--maroon)">${pct}%</div>
    </div>
    <div class="review-item">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span class="muted" style="font-size:12px">Missed question ${idx+1} of ${missed.length} &middot; ${m.skill}</span>
        <span class="tag-missed">Missed</span>
      </div>
      <p style="font-size:13px;margin:0 0 12px">${m.prompt}</p>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px">
        <span class="muted">Your answer:</span>
        <span style="font-weight:500">${m.chosen ? m.chosen + ' \u2014 ' + m.choices[m.chosen].text : 'No answer given'}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px">
        <span class="muted">Correct answer:</span>
        <span style="font-weight:500">${m.correct} \u2014 ${m.choices[m.correct].text}</span>
      </div>
      <div style="border-top:0.5px solid var(--border);padding-top:12px">
        ${chosenExplain ? `
        <p style="font-size:12px;font-weight:500;color:var(--maroon);margin:0 0 4px">Why ${m.chosen} doesn't work</p>
        <p style="font-size:13px;margin:0 0 10px">${chosenExplain}</p>` : `
        <p style="font-size:12px;font-weight:500;color:var(--maroon);margin:0 0 4px">No answer was selected</p>
        <p style="font-size:13px;margin:0 0 10px">Running out of time on a question like this is worth noting for pacing next time.</p>`}
        <p style="font-size:12px;font-weight:500;color:var(--success);margin:0 0 4px">Why ${m.correct} is correct</p>
        <p style="font-size:13px;margin:0 0 10px">${correctExplain}</p>
        ${findLessonBySkill(m.skill) ? `<a href="#" onclick="openLessonFromReview('${findLessonBySkill(m.skill).id}');return false" style="font-size:13px;color:var(--maroon);font-weight:500;text-decoration:none">Review this skill: ${findLessonBySkill(m.skill).title} &rarr;</a>` : ''}
      </div>
    </div>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <span class="muted" style="font-size:12px">${isLastMissed ? 'Last one' : (missed.length - idx - 1) + ' more to review'}</span>
      ${isLastMissed
        ? `<button class="btn" onclick="backToDashboardFromReview()">Back to dashboard</button>`
        : `<button class="btn" onclick="nextMissed()">Next question &rarr;</button>`}
    </div>
  `;
}

  practiceState.reviewIndex++;
  renderView();
}

// ---------- Vocabulary SRS (simple 5-box Leitner system) ----------
const LEITNER_INTERVALS_DAYS = [0, 1, 2, 4, 7, 14]; // index = box number (0 unused, boxes 1-5)

function getDueVocab(){
  const today = new Date().toISOString().slice(0,10);
  return VOCAB_WORDS.filter(w => {
    const rec = profile.skills_progress.vocab[w.id];
    if (!rec) return true; // never studied = due now
    return rec.due <= today;
  });
}

function openVocab(){
  const due = getDueVocab();
  const queue = due.length > 0 ? due : [...VOCAB_WORDS]; // if nothing due, allow reviewing anyway
  skillState.mode = 'vocab';
  skillState.vocabQueue = shuffleArray(queue);
  skillState.vocabIndex = 0;
  skillState.vocabAnswered = false;
  renderView();
}

function shuffleArray(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function vocabHTML(){
  if (skillState.vocabIndex >= skillState.vocabQueue.length) {
    return `<h1>Vocabulary in context</h1>
      <div class="card" style="margin-top:16px"><p style="margin:0;font-weight:500">Nice work \u2014 you've been through all the due words.</p></div>
      <div style="margin-top:16px"><button class="btn ghost" onclick="backToSkillMenu()">Back to skill builder</button></div>`;
  }
  const w = skillState.vocabQueue[skillState.vocabIndex];
  let choicesHTML = '';
  Object.entries(w.choices).forEach(([letter, c]) => {
    const isSelected = skillState.vocabSelected === letter;
    let extra = '';
    if (skillState.vocabAnswered) {
      if (letter === w.correct) extra = 'border:1.5px solid var(--success)';
      else if (isSelected) extra = 'border:1.5px solid var(--maroon)';
    }
    choicesHTML += `<div class="choice-row ${isSelected?'selected':''}" style="${extra}" onclick="answerVocab('${letter}')">
      <span class="choice-dot"></span><span style="font-size:13px">${c.text}</span></div>`;
  });
  let feedback = '';
  if (skillState.vocabAnswered) {
    const chosen = w.choices[skillState.vocabSelected];
    feedback = `<div class="model-answer">${skillState.vocabSelected === w.correct ? 'Correct. ' : 'Not quite. '}${chosen.explain}</div>
      <div style="margin-top:14px"><button class="btn" onclick="nextVocab()">Next word</button></div>`;
  }
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <h1 style="font-size:18px">Vocabulary in context</h1>
      <span class="streak-pill">${skillState.vocabIndex+1} of ${skillState.vocabQueue.length}</span>
    </div>
    <div class="flashcard">
      <p style="font-family:'Source Serif 4',serif;font-size:24px;font-weight:600;margin:0 0 4px">${w.word}</p>
      <p class="muted" style="font-size:12px;margin:0 0 16px">${w.pos}</p>
      <p style="font-size:14px;line-height:1.6;margin:0">${w.sentence}</p>
    </div>
    <div>${choicesHTML}</div>
    ${feedback}
    <div style="margin-top:14px"><button class="btn ghost" onclick="backToSkillMenu()">Exit</button></div>
  `;
}

async function answerVocab(letter){
  if (skillState.vocabAnswered) return;
  skillState.vocabSelected = letter;
  skillState.vocabAnswered = true;
  const w = skillState.vocabQueue[skillState.vocabIndex];
  const correct = letter === w.correct;
  const today = new Date().toISOString().slice(0,10);
  const rec = profile.skills_progress.vocab[w.id] || { box: 1, due: today };
  let newBox = correct ? Math.min(5, rec.box + 1) : 1;
  const dueDate = new Date();
  dueDate.setDate(dueDate.getDate() + LEITNER_INTERVALS_DAYS[newBox]);

// ---------- Quick-fire quant & math ----------
function openQuickfirePicker(){
  skillState.mode = 'quickfire';

// Group a category's items by difficulty tier once per round, so draws are cheap.
function qfBuildPools(category){
  const pools = { easy: [], medium: [], hard: [] };
  QUICKFIRE[category].forEach(q => { if (pools[q.difficulty]) pools[q.difficulty].push(q); });
  return pools;
}

// Pick a tier for the next question, weighted by the student's current level.
function qfPickTier(level){
  const w = QF_LEVEL_WEIGHTS[level] || QF_LEVEL_WEIGHTS.easy;
  const r = Math.random();
  let cumulative = 0;
  for (const tier of ['easy', 'medium', 'hard']) {
    cumulative += w[tier];
    if (r < cumulative) return tier;
  }
  return 'medium';
}

// Draw one not-yet-used question, weighted toward the current adaptive level.
// Falls back to neighboring tiers if the preferred tier is exhausted (shouldn't
// normally happen — each tier has 80+ items per category, far more than a
// 10-question round could draw from a single tier).
function qfDrawQuestion(){
  let tier = qfPickTier(skillState.qfLevel);
  let pool = skillState.qfPools[tier].filter(q => !skillState.qfUsedIds.has(q.id));
  if (pool.length === 0) {
    const fallbackOrder = tier === 'easy' ? ['medium', 'hard'] : tier === 'hard' ? ['medium', 'easy'] : ['easy', 'hard'];
    for (const t of fallbackOrder) {
      pool = skillState.qfPools[t].filter(q => !skillState.qfUsedIds.has(q.id));
      if (pool.length > 0) { tier = t; break; }
    }
  }
  if (pool.length === 0) return null;
  const q = pool[Math.floor(Math.random() * pool.length)];
  skillState.qfUsedIds.add(q.id);
  skillState.qfLevelStats[tier] = (skillState.qfLevelStats[tier] || 0) + 1;
  return q;
}

// 3-correct-in-a-row moves up a tier; 2-incorrect-in-a-row moves down a tier.
// Returns 'up', 'down', or null so the caller can show/persist a change.
function qfUpdateLevel(correct){
  const order = ['easy', 'medium', 'hard'];
  let idx = order.indexOf(skillState.qfLevel);
  let direction = null;
  if (correct) {
    skillState.qfCorrectStreak++;
    skillState.qfIncorrectStreak = 0;
    if (skillState.qfCorrectStreak >= 3 && idx < order.length - 1) {
      idx++;
      skillState.qfCorrectStreak = 0;
      direction = 'up';
    }
  } else {
    skillState.qfIncorrectStreak++;
    skillState.qfCorrectStreak = 0;
    if (skillState.qfIncorrectStreak >= 2 && idx > 0) {
      idx--;
      skillState.qfIncorrectStreak = 0;
      direction = 'down';
    }
  }
  if (direction) skillState.qfLevel = order[idx];
  return direction;
}

function startQuickfire(category){
  skillState.qfCategory = category;
  skillState.qfLevel = (profile.skills_progress.qfAdaptive[category] || {}).level || 'easy';
  skillState.qfCorrectStreak = 0;
  skillState.qfIncorrectStreak = 0;
  skillState.qfUsedIds = new Set();
  skillState.qfPools = qfBuildPools(category);
  skillState.qfLevelStats = { easy: 0, medium: 0, hard: 0 };
  skillState.qfLevelChangeMsg = null;
  skillState.qfQueue = [qfDrawQuestion()];
  skillState.qfIndex = 0;
  skillState.qfScore = 0;
  skillState.qfAnswered = false;
  skillState.qfDone = false;
  skillState.qfSecondsLeft = QF_TIME_PER_QUESTION;

}

function startQfTimer(){
  if (skillState.qfTimerHandle) clearInterval(skillState.qfTimerHandle);
  skillState.qfTimerHandle = setInterval(() => {
    skillState.qfSecondsLeft--;
    const el = document.getElementById('qf-timer');
    if (el) el.textContent = skillState.qfSecondsLeft + 's';
    if (skillState.qfSecondsLeft <= 0) {
      clearInterval(skillState.qfTimerHandle);
      if (!skillState.qfAnswered) {
        skillState.qfAnswered = true;
        skillState.qfSelected = null;
        const q = skillState.qfQueue[skillState.qfIndex];
        logMistake({ source:'quickfire', detail:skillState.qfCategory, prompt:q.prompt, chosen:'No answer (time ran out)', correct:q.choices[q.correct].text });
        const direction = qfUpdateLevel(false);
        if (direction) {
          skillState.qfLevelChangeMsg = direction;
          profile.skills_progress.qfAdaptive[skillState.qfCategory].level = skillState.qfLevel;
          saveProfile({ skills_progress: profile.skills_progress });

        renderView();
      }
    }
  }, 1000);
}

function answerQuickfire(letter){
  if (skillState.qfAnswered) return;
  clearInterval(skillState.qfTimerHandle);
  skillState.qfSelected = letter;

    logMistake({ source:'quickfire', detail:skillState.qfCategory, prompt:q.prompt, chosen:q.choices[letter].text, correct:q.choices[q.correct].text });
  }

  if (direction) {

async function nextQuickfire(){
  skillState.qfIndex++;
  skillState.qfAnswered = false;
  skillState.qfSelected = null;
  skillState.qfLevelChangeMsg = null;
  if (skillState.qfIndex >= QF_ROUND_SIZE) {
    skillState.qfDone = true;
    const best = profile.skills_progress.quickfireBest[skillState.qfCategory] || 0;
    if (skillState.qfScore > best) {
      profile.skills_progress.quickfireBest[skillState.qfCategory] = skillState.qfScore;
      await saveProfile({ skills_progress: profile.skills_progress });
    }

// ---------- Pacing plan ----------
// Picks the section with the lowest current mastery (ties broken by SECTIONS order).
function pickWeakestSection(){
  const m = profile.mastery || {};
  let weakest = SECTIONS[0].key, weakestVal = 101;
  SECTIONS.forEach(s => {
    const v = m[s.key] ?? 0;
    if (v < weakestVal) { weakestVal = v; weakest = s.key; }
  });
  return weakest;
}

function nextIncompleteLesson(sectionKey){
  return LESSONS.find(l => l.section === sectionKey && !profile.lessons_completed[l.id]) || null;
}

// Weakest-mastery section that still has an unfinished lesson, so lesson-day never
// points at a section the student has already completed every lesson for.
function pickWeakestSectionWithIncompleteLesson(){
  const ordered = [...SECTIONS].sort((a,b) =>
    ((profile.mastery && profile.mastery[a.key]) || 0) - ((profile.mastery && profile.mastery[b.key]) || 0));
  for (const s of ordered) { if (nextIncompleteLesson(s.key)) return s.key; }
  return null;
}

// Priority order used when a blocked day's task rolls forward onto the next
// available day — highest-value tasks (practice tests) win the first open slot;
// lowest-priority tasks are what quietly drop if a week doesn't have enough
// available days to fit everything.
const PACING_PRIORITY = ['practice-full','practice-section','lesson','lesson-review','vocab','quickfire','review','dojo','punctuation'];
function pacingPriorityRank(type){
  const idx = PACING_PRIORITY.indexOf(type);
  return idx === -1 ? PACING_PRIORITY.length : idx;
}

function isDayAvailable(dow){
  const avail = (profile.pacing_plan && profile.pacing_plan.availableDays) || [true,true,true,true,true,true,true];
  return avail[dow] !== false;
}

function togglePacingAvailability(dow){
  const avail = [...((profile.pacing_plan && profile.pacing_plan.availableDays) || [true,true,true,true,true,true,true])];
  avail[dow] = !avail[dow];
  profile.pacing_plan.availableDays = avail;
  saveProfile({ pacing_plan: profile.pacing_plan });
  renderView();
}

// What a given date would get in the plain weekly rotation, ignoring availability
// entirely. `fixed:true` marks days (taper/test day/after test) that never move and
// never interact with the rollover queue, regardless of availability settings.
function pacingNativeTask(dateObj){
  const testDateObj = new Date(profile.test_date + 'T00:00:00');
  const msPerDay = 86400000;
  const daysUntilTest = Math.round((testDateObj - dateObj) / msPerDay);

  if (daysUntilTest < 0) return { type:'after-test', label:'\u2014', color:'var(--border)', actionable:false, fixed:true };
  if (daysUntilTest === 0) return { type:'testday', label:'Test day!', color:'var(--maroon)', actionable:false, fixed:true };
  if (daysUntilTest === 1) return { type:'taper', label:'Light review, rest up', color:'var(--slate)', actionable:false, fixed:true };

  const dow = dateObj.getDay(); // 0 Sun .. 6 Sat
  const weekParity = Math.floor(daysUntilTest / 7) % 2;

  if (dow === 0) return { type:'rest', label:'Rest day', color:'var(--border)', actionable:false, fixed:false };

  if (dow === 1) {
    // Keep full-length (2h21m) tests off the schedule in the final stretch; favor a
    // single weak-section test instead, and alternate full/section tests in earlier weeks.
    if (daysUntilTest < 5 || weekParity === 1) {
      const sec = pickWeakestSection();
      const info = SECTIONS.find(s => s.key === sec);
      return { type:'practice-section', sectionKey:sec, label:info.name+' practice test', color:info.color, actionable:true, fixed:false };
    }
    return { type:'practice-full', label:'Full practice test', color:'var(--maroon)', actionable:true, fixed:false };
  }
  if (dow === 2) {
    const weakSection = pickWeakestSectionWithIncompleteLesson();
    if (weakSection) {
      const lesson = nextIncompleteLesson(weakSection);
      const info = SECTIONS.find(s => s.key === weakSection);
      return { type:'lesson', lessonId:lesson.id, label:'Lesson: '+lesson.title, color:info.color, actionable:true, fixed:false };
    }
    return { type:'lesson-review', label:'Review any lesson', color:'var(--ink)', actionable:true, fixed:false };
  }
  if (dow === 3) return { type:'vocab', label:'Vocab practice', color:'var(--gold)', actionable:true, fixed:false };
  if (dow === 4) return { type:'quickfire', label:'Quick-fire drills', color:'var(--success)', actionable:true, fixed:false };
  if (dow === 5) return { type:'review', label:'Review missed questions', color:'var(--slate)', actionable:true, fixed:false };
  // Saturday
  return weekParity === 0
    ? { type:'dojo', label:'Logic Dojo', color:'var(--ink)', actionable:true, fixed:false }
    : { type:'punctuation', label:'Punctuation surgeon', color:'var(--ink)', actionable:true, fixed:false };
}

// Computes the full Sun-Sat task assignment for the calendar week containing
// `anyDateInWeek`. Fixed days (taper/test day/after-test) are untouched by
// availability. For the remaining days, any day the student marked unavailable
// contributes its native task to a pending queue instead of being assigned it; each
// available day then pulls the highest-priority pending task, or falls back to its
// own native task if nothing is waiting. Anything still pending at week's end drops.
function pacingWeekAssignments(anyDateInWeek){
  const sunday = new Date(anyDateInWeek);
  sunday.setHours(0,0,0,0);
  sunday.setDate(sunday.getDate() - sunday.getDay());

  const days = [];
  for (let i=0; i<7; i++){
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    days.push(d);
  }

  const results = new Array(7).fill(null);
  const pending = []; // native tasks waiting for a slot (from blocked days or prior preemptions)

  days.forEach((d, i) => {
    const native = pacingNativeTask(d);
    if (native.fixed) { results[i] = native; return; }

    if (!isDayAvailable(i)) {
      results[i] = { type:'unavailable', label:'Not a study day', color:'var(--border)', actionable:false, fixed:false };
      if (native.type !== 'rest') pending.push({ ...native, rolledFrom:i });
      return;
    }

    // Available day: this day's own task competes for the slot alongside anything
    // already queued, so a task that loses out here (not just a directly-blocked
    // one) also rolls forward instead of quietly vanishing.
    const candidates = native.type === 'rest' ? [...pending] : [...pending, native];
    if (candidates.length === 0) { results[i] = native; return; }
    candidates.sort((a,b) => pacingPriorityRank(a.type) - pacingPriorityRank(b.type));
    const winner = candidates.shift();
    results[i] = winner === native ? native : { ...winner, rolledOver:true };
    pending.length = 0;
    pending.push(...candidates);
  });

  return results;
}

function pacingTaskForDate(dateObj){
  return pacingWeekAssignments(dateObj)[dateObj.getDay()];
}

// Jumps straight into whatever pacingTodayTask points at. Navigates to the picker
// (rather than auto-starting) for practice tests, since those are a real time
// commitment the student should confirm themselves.
function pacingGoAction(task){
  if (!task) return;
  switch (task.type) {
    case 'practice-full':
    case 'practice-section':
      setView('practice');
      break;
    case 'lesson':
      setView('lessons'); openLesson(task.lessonId);
      break;
    case 'lesson-review':
      setView('lessons');
      break;
    case 'vocab':
      setView('skills'); openVocab();
      break;
    case 'quickfire':
      setView('skills'); openQuickfirePicker();
      break;
    case 'dojo':
      setView('skills'); openDojo();
      break;
    case 'punctuation':
      setView('skills'); openPunctuation();
      break;
    case 'review':
      setView('mistakes');
      break;
  }
}

function togglePacingDay(dateStr){
  const completed = { ...(profile.pacing_plan.completed || {}) };
  if (completed[dateStr]) delete completed[dateStr];
  else completed[dateStr] = true;
  profile.pacing_plan.completed = completed;
  saveProfile({ pacing_plan: profile.pacing_plan });
  renderView();
}

function changePacingMonth(delta){
  pacingState.monthOffset += delta;
  renderView();
}

function renderPacingPlan(){
  const root = document.getElementById('view-root');
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toISOString().slice(0,10);
  pacingTodayTask = pacingTaskForDate(today);
  const completed = profile.pacing_plan.completed || {};

  const monthDate = new Date();
  monthDate.setDate(1);
  monthDate.setMonth(monthDate.getMonth() + pacingState.monthOffset);
  const monthLabel = monthDate.toLocaleString('en-US', { month:'long', year:'numeric' });
  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  let cells = '';
  for (let i=0; i<firstDow; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const cellDate = new Date(year, month, d);
    const cellDateStr = cellDate.toISOString().slice(0,10);
    const task = pacingTaskForDate(cellDate);
    const isToday = cellDateStr === todayStr;
    const isDone = !!completed[cellDateStr];
    const canToggle = task.type !== 'after-test' && task.type !== 'rest' && task.type !== 'testday' && task.type !== 'unavailable';
    const labelText = task.rolledOver ? '\u21b3 ' + task.label : task.label;
    cells += `<div class="cal-cell ${canToggle?'clickable':''} ${isToday?'today':''} ${isDone?'done':''}"
        style="border-left:4px solid ${task.color}" ${canToggle?`onclick="togglePacingDay('${cellDateStr}')"`:''}>
      <span class="cal-daynum">${d}${isDone?' \u2713':''}</span>
      <span class="cal-task">${labelText}</span>
    </div>`;
  }
  const dowNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dowLabels = dowNames.map(l => `<div class="cal-dow">${l}</div>`).join('');
  const days = daysUntil(profile.test_date);
  const availToggles = dowNames.map((lbl, i) => {
    const on = isDayAvailable(i);
    return `<button class="btn ${on?'':'ghost'}" style="padding:6px 12px;font-size:12px" onclick="togglePacingAvailability(${i})">${lbl}</button>`;
  }).join('');

  root.innerHTML = `
    <h1>Pacing plan</h1>
    <p class="muted" style="margin:6px 0 20px">
      ${days >= 0
        ? days + ' days until test day \u2014 a suggested task for each day, weighted toward your weaker sections. Tap a day to check it off.'
        : 'Test day has passed \u2014 set a new date from the Dashboard to plan another stretch.'}
    </p>
    <div class="card" style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>
        <p class="muted" style="font-size:12px;margin:0 0 4px">Today's task</p>
        <p style="margin:0;font-weight:500;font-size:14px">${pacingTodayTask.label}</p>
      </div>
      ${pacingTodayTask.actionable ? `<button class="btn" onclick="pacingGoAction(pacingTodayTask)">Go</button>` : ''}
    </div>
    <div class="card" style="margin-bottom:20px">
      <p style="font-weight:500;font-size:13px;margin:0 0 4px">Which days can you study?</p>
      <p class="muted" style="font-size:12px;margin:0 0 10px">Turn off a day you're always busy \u2014 its task rolls forward to your next available day instead of getting skipped.</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${availToggles}</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <button class="btn ghost" onclick="changePacingMonth(-1)">&larr; Prev</button>
      <p style="font-weight:500;margin:0">${monthLabel}</p>
      <button class="btn ghost" onclick="changePacingMonth(1)">Next &rarr;</button>
    </div>
    <div class="cal-grid">${dowLabels}${cells}</div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:11px;color:var(--slate)">
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--maroon);margin-right:4px"></span>Practice test</span>
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--gold);margin-right:4px"></span>Vocab</span>
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--success);margin-right:4px"></span>Quick-fire</span>
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--ink);margin-right:4px"></span>Lesson &middot; Dojo &middot; Punctuation</span>
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--slate);margin-right:4px"></span>Review / taper</span>
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--border);margin-right:4px"></span>Rest / day off</span>
      <span>\u21b3 = rolled forward from a day off</span>
    </div>
  `;
}

function dashboardHTML(){
  const days = daysUntil(profile.test_date);
  pacingTodayTask = pacingTaskForDate(new Date());
  let tiles = '';
  SECTIONS.forEach(s => {
    const val = (profile.mastery && profile.mastery[s.key]) || 0;
    tiles += `<div class="tile" style="border-top-color:${s.color}">
      <p class="name">${s.name}</p>
      <p class="pct">${val}% mastery</p>
      <div class="bar"><div style="width:${val}%;background:${s.color}"></div></div>
    </div>`;
  });
  return `
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
      <h1>Good to see you, ${profile.name}</h1>
      <button class="btn ghost" onclick="openSettings()">Edit profile</button>
    </div>
    <p class="muted" style="margin:0 0 20px">${days >= 0 ? days + ' days until test day' : 'Test day has passed — set a new date'}</p>
    <div class="card" style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>
        <p class="muted" style="font-size:12px;margin:0 0 4px">Today's pacing plan task</p>
        <p style="margin:0;font-weight:500;font-size:14px">${pacingTodayTask.label}</p>
      </div>
      ${pacingTodayTask.actionable
        ? `<button class="btn" onclick="pacingGoAction(pacingTodayTask)">Go</button>`
        : `<button class="btn ghost" onclick="setView('pacing')">View plan</button>`}
    </div>
    <div class="card" style="margin-bottom:20px">
      ${profile.resume_section
        ? `<p class="muted" style="font-size:13px;margin:0 0 8px">Continue where you left off</p>
           <div style="display:flex;justify-content:space-between;align-items:center">
             <span style="font-size:13px;font-weight:500">${profile.resume_section}</span>
             <button class="btn" onclick="setView('practice')">Resume</button>
           </div>`
        : `<p style="margin:0 0 4px;font-weight:500;font-size:14px">Start your first practice test</p>
           <p class="muted" style="font-size:13px;margin:0 0 12px">Full-length or single-section, timed like the real thing.</p>
           <button class="btn" onclick="setView('practice')">New practice test</button>`
      }
    </div>
    <p class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:0.04em;margin:0 0 4px">Your sections</p>
    <div class="tiles">${tiles}</div>
    <div class="quicklinks">
      <div class="quick primary" onclick="setView('tutor')">Ask AI tutor</div>
      <div class="quick" onclick="setView('skills')">Skill builder</div>
      <div class="quick" onclick="setView('lessons')">Lessons</div>
      <div class="quick" onclick="setView('pacing')">Pacing plan</div>
    </div>
    <div id="settings-panel"></div>
  `;
}

function openSettings(){
  const panel = document.getElementById('settings-panel');
  panel.innerHTML = `
    <div class="card" style="margin-top:16px">
      <p style="font-weight:500;font-size:13px;margin:0 0 10px">Edit profile</p>
      <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap">
        <input id="edit-name" value="${profile.name}" placeholder="Name" style="flex:1;min-width:120px">
        <input id="edit-date" type="date" value="${profile.test_date}">
      </div>
      <button class="btn" onclick="saveSettings()">Save</button>
    </div>`;
}

async function saveSettings(){
  const name = document.getElementById('edit-name').value || profile.name;
  const test_date = document.getElementById('edit-date').value || profile.test_date;
  await saveProfile({ name, test_date });
  renderNav(); renderView();
}

// ---------- AI tutor ----------
function tutorHTML(){
  let log = '';
  tutorHistory.forEach(turn => {
    log += `<div class="bubble ${turn.role === 'student' ? 'student' : 'tutor'}">${turn.text}</div>`;
  });
  if (!tutorHistory.length) {
    log = `<div class="bubble tutor">Hi ${profile.name}, I'm your Merit tutor. Tell me a topic you'd like help with — or a question you got wrong.</div>`;
  }
  return `
    <h1>AI tutor</h1>
    <div class="warning">
      This tutor runs on Google's free-tier Gemini API. Your messages here may be used by Google to help train future models.
      Don't share anything personal or sensitive — no full name, address, school details beyond what's needed, passwords, or private family information. Keep it to HSPT questions and topics.
    </div>
    <div class="chatlog" id="chatlog">${log}</div>
    <div class="chat-input-row">
      <input id="tutor-input" type="text" placeholder="Ask about a topic, or paste a question you missed" onkeydown="if(event.key==='Enter') sendTutorMessage()">
      <button class="btn" onclick="sendTutorMessage()">Send</button>
    </div>
  `;
}

function scrollChatToBottom(){
  const el = document.getElementById('chatlog');
  if (el) el.scrollTop = el.scrollHeight;
}

async function sendTutorMessage(){
  const input = document.getElementById('tutor-input');
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  tutorHistory.push({ role: 'student', text: message });
  renderView();

  try {
    const res = await fetch('/api/tutor', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, history: tutorHistory.slice(0, -1) })
    });
    const data = await res.json();
    tutorHistory.push({ role: 'tutor', text: data.reply || data.error || 'Something went wrong.' });
  } catch (e) {
    tutorHistory.push({ role: 'tutor', text: 'Could not reach the tutor. Please try again.' });
  }
  renderView();
}

// ---------- Init ----------
// ================= Lessons =================
function findLessonBySkill(skill){
  return LESSONS.find(l => l.skillTags.includes(skill)) || null;
}

function openLessonFromReview(lessonId){
  setView('lessons');
  openLesson(lessonId);
}

function renderLessons(){
  const root = document.getElementById('view-root');
  if (lessonsState.view === 'detail') { root.innerHTML = lessonDetailHTML(); return; }
  root.innerHTML = lessonsMenuHTML();
}

function lessonsMenuHTML(){
  let html = `<h1>Lessons</h1><p class="muted" style="margin:6px 0 0">Short study guides for every topic tested on the HSPT, each with a quick comprehension check.</p>`;
  SECTIONS.forEach(s => {
    const sectionLessons = LESSONS.filter(l => l.section === s.key);
    if (sectionLessons.length === 0) return;
    html += `<p class="lesson-section-header">${s.name}</p>`;
    sectionLessons.forEach(l => {
      const done = !!profile.lessons_completed[l.id];
      html += `<div class="lesson-row" onclick="openLesson('${l.id}')">
        <span style="font-size:13px">${l.title}</span>
        <span class="lesson-check ${done ? 'done' : 'todo'}">${done ? '\u2713' : ''}</span>
      </div>`;
    });
  });
  return html;
}

function openLesson(lessonId){
  lessonsState.view = 'detail';
  lessonsState.currentLessonId = lessonId;
  lessonsState.phase = 'content';
  lessonsState.quizIndex = 0;
  lessonsState.quizAnswered = false;
  lessonsState.quizSelected = null;
  lessonsState.quizScore = 0;
  renderView();
}

function backToLessonsMenu(){
  lessonsState.view = 'menu';
  renderView();
}

function lessonDetailHTML(){
  const lesson = LESSONS.find(l => l.id === lessonsState.currentLessonId);
  if (lessonsState.phase === 'content') {
    return `
      <p class="muted" style="font-size:12px;margin:0 0 4px">${SECTIONS.find(s=>s.key===lesson.section).name}</p>
      <h1 style="margin-bottom:14px">${lesson.title}</h1>
      <div class="lesson-content">${lesson.content}</div>
      <div style="margin-top:18px;display:flex;gap:8px">
        <button class="btn" onclick="startLessonQuiz()">Take the quick check</button>
        <button class="btn ghost" onclick="backToLessonsMenu()">Back to lessons</button>
      </div>
    `;
  }
  if (lessonsState.phase === 'quiz') {
    const q = lesson.quiz[lessonsState.quizIndex];
    let choicesHTML = '';
    Object.entries(q.choices).forEach(([letter, c]) => {
      const isSelected = lessonsState.quizSelected === letter;
      let extra = '';
      if (lessonsState.quizAnswered) {
        if (letter === q.correct) extra = 'border:1.5px solid var(--success)';
        else if (isSelected) extra = 'border:1.5px solid var(--maroon)';
      }
      choicesHTML += `<div class="choice-row ${isSelected?'selected':''}" style="${extra}" onclick="answerLessonQuiz('${letter}')">
        <span class="choice-dot"></span><span style="font-size:13px">${c.text}</span></div>`;
    });
    let feedback = '';
    if (lessonsState.quizAnswered) {
      const chosen = q.choices[lessonsState.quizSelected];
      const isLast = lessonsState.quizIndex === lesson.quiz.length - 1;
      feedback = `<div class="model-answer">${chosen.explain}</div>
        <div style="margin-top:14px"><button class="btn" onclick="nextLessonQuizQuestion()">${isLast ? 'See results' : 'Next question'}</button></div>`;
    }
    return `
      <p class="muted" style="font-size:12px;margin:0 0 4px">${lesson.title} \u2014 comprehension check</p>
      <h1 style="font-size:18px;margin-bottom:14px">Question ${lessonsState.quizIndex+1} of ${lesson.quiz.length}</h1>
      <p style="font-size:14px;font-weight:500;margin:0 0 14px">${q.prompt}</p>
      <div>${choicesHTML}</div>
      ${feedback}
    `;
  }
  // result
  const total = lesson.quiz.length;
  return `
    <h1>Nice work</h1>
    <div class="card" style="margin-top:16px">
      <p style="margin:0;font-weight:500">You got ${lessonsState.quizScore} of ${total} on the comprehension check for "${lesson.title}."</p>
    </div>
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn" onclick="openLesson('${lesson.id}')">Review again</button>
      <button class="btn ghost" onclick="backToLessonsMenu()">Back to lessons</button>
    </div>
  `;
}

function startLessonQuiz(){
  lessonsState.phase = 'quiz';
  lessonsState.quizIndex = 0;
  lessonsState.quizAnswered = false;
  lessonsState.quizSelected = null;
  lessonsState.quizScore = 0;
  renderView();
}

function answerLessonQuiz(letter){
  if (lessonsState.quizAnswered) return;
  const lesson = LESSONS.find(l => l.id === lessonsState.currentLessonId);
  const q = lesson.quiz[lessonsState.quizIndex];
  lessonsState.quizSelected = letter;
  lessonsState.quizAnswered = true;
  if (letter === q.correct) {
    lessonsState.quizScore++;
  } else {
    logMistake({ source:'lesson', detail:lesson.title, prompt:q.prompt, chosen:q.choices[letter].text, correct:q.choices[q.correct].text });
  }
  renderView();
}

async function nextLessonQuizQuestion(){
  const lesson = LESSONS.find(l => l.id === lessonsState.currentLessonId);
  lessonsState.quizIndex++;
  lessonsState.quizAnswered = false;
  lessonsState.quizSelected = null;
  if (lessonsState.quizIndex >= lesson.quiz.length) {
    lessonsState.phase = 'result';
    profile.lessons_completed[lesson.id] = true;
    await saveProfile({ lessons_completed: profile.lessons_completed });
    renderView();
    return;
  }
  renderView();
}

// ================= Mistake Journal =================
function mistakeGroup(source){
  if (source === 'practice') return 'Practice test';
  if (source === 'lesson') return 'Lesson comprehension check';
  return 'Skill builder'; // vocab, dojo, quickfire, punctuation
}

function mistakeSourceLabel(m){
  if (m.source === 'practice') return 'Practice test' + (m.section ? ' \u2014 ' + (SECTIONS.find(s=>s.key===m.section)||{}).name : '');
  if (m.source === 'vocab') return 'Skill builder \u2014 Vocabulary';
  if (m.source === 'dojo') return 'Skill builder \u2014 Logic & analogy dojo (' + (m.detail||'') + ')';
  if (m.source === 'quickfire') return 'Skill builder \u2014 Quick-fire (' + (m.detail||'') + ')';
  if (m.source === 'punctuation') return 'Skill builder \u2014 Punctuation surgeon';
  if (m.source === 'lesson') return 'Lesson \u2014 ' + (m.detail || '');
  return 'Skill builder';
}

function setMistakeFilter(f){
  mistakeFilter = f;
  renderView();
}

function renderMistakeJournal(){
  const root = document.getElementById('view-root');
  const all = [...(profile.mistakes || [])].reverse();
  const filtered = mistakeFilter === 'all' ? all : all.filter(m => mistakeGroup(m.source) === mistakeFilter);

  const groups = ['all', 'Practice test', 'Skill builder', 'Lesson comprehension check'];
  let filterBar = '<div style="display:flex;gap:8px;margin:14px 0;flex-wrap:wrap">';
  groups.forEach(g => {
    const active = mistakeFilter === g;
    filterBar += `<button class="btn ${active ? '' : 'ghost'}" style="font-size:12px;padding:6px 12px" onclick="setMistakeFilter('${g}')">${g === 'all' ? 'All' : g}</button>`;
  });
  filterBar += '</div>';

  let rows;
  if (filtered.length === 0) {
    rows = `<div class="placeholder"><p class="muted" style="margin:0">${all.length === 0 ? 'No mistakes logged yet \u2014 that\u2019s a good thing.' : 'Nothing in this category yet.'}</p></div>`;
  } else {
    rows = '';
    filtered.forEach(m => {
      const lesson = (m.source === 'practice' && m.skill) ? findLessonBySkill(m.skill) : null;
      rows += `<div class="review-item">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span class="muted" style="font-size:12px">${mistakeSourceLabel(m)} &middot; ${m.date}</span>
          <span class="tag-missed">Missed</span>
        </div>
        <p style="font-size:13px;margin:0 0 10px">${m.prompt}</p>
        <div style="font-size:13px;margin-bottom:4px"><span class="muted">Your answer:</span> <strong>${m.chosen || 'No answer'}</strong></div>
        <div style="font-size:13px;margin-bottom:${lesson ? '10px' : '0'}"><span class="muted">Correct answer:</span> <strong>${m.correct}</strong></div>
        ${lesson ? `<a href="#" onclick="openLessonFromReview('${lesson.id}');return false" style="font-size:13px;color:var(--maroon);font-weight:500;text-decoration:none">Review this skill: ${lesson.title} &rarr;</a>` : ''}
      </div>`;
    });
  }

  root.innerHTML = `
    <h1>Mistake journal</h1>
    <p class="muted" style="margin:6px 0 0">Every miss across practice tests, skill builder, and lessons, in one place.</p>
    ${filterBar}
    ${rows}
  `;
}

// When the user clicks the password-reset link in their email, Supabase parses the
// recovery token from the URL and fires this event with a temporary session — show
// the "set a new password" screen instead of the normal login/app flow.
supa.auth.onAuthStateChange((event, sess) => {
  if (event === 'PASSWORD_RECOVERY') {
    session = sess;
    renderResetPassword();
  }
});

async function init(){
  const { data } = await supa.auth.getSession();
  session = data.session;
  if (session) { await afterLogin(); }
  else { renderAuth('login'); }
}
init();
</script>
